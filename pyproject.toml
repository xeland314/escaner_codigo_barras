[project]
name = "escaner-codigo-barras"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christopher Villamarín", email = "alexpila.314@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "evdev>=2.0.0",
    "fastapi>=0.161.1",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "python-barcode>=0.16.1",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
escaner-codigo-barras = "escaner_codigo_barras:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
